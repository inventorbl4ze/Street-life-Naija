<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101c25">
  <title>CITY LIFE: UNLIMITED</title>
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <div class="hud-card"><b>₦<span id="money">3,500</span></b><small id="status">On foot · Energy 100%</small></div>
    <div class="hud-card right"><b>CITY LIFE</b><small id="objective">Explore the city</small></div>
  </div>
  <div id="crosshair">●</div>
  <div id="toast"></div>
  <div id="touch-ui">
    <div id="stick"><div id="nub"></div></div>
    <div id="actions">
      <button id="interact">ACTION</button>
      <button id="vehicle">ENTER CAR</button>
      <button id="sprint">SPRINT</button>
      <button id="save">SAVE</button>
    </div>
  </div>
  <div id="start-screen">
    <section>
      <div class="eyebrow">SINGLE PLAYER · OPEN CITY</div>
      <h1>CITY LIFE:<br><span>UNLIMITED</span></h1>
      <p>Explore a growing 3D city. Walk the streets, drive cars, discover buildings and create your own story.</p>
      <button id="start">ENTER THE CITY</button>
      <small>Prototype build 0.2 · Your progress saves on this device</small>
    </section>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
